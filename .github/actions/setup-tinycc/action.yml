name: Set up tinycc
description: Build ntlibc's pinned cross toolchain via flake.nix's `tcc` package, restoring it from cache on a hit

runs:
  using: composite
  steps:
    # cachix/install-nix-action, not DeterminateSystems/nix-installer-action
    # -- see .github/workflows/ci.yml's `linux-builds` job for the full
    # rationale (no FlakeHub registration here, so the Determinate
    # installer's default FlakeHub login always fails).
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ github.token }}
    - name: Set up Magic Nix Cache
      uses: DeterminateSystems/magic-nix-cache-action@v14
      with:
        # use-flakehub: false / diagnostic-endpoint: "" -- see ci.yml's
        # `linux-builds` job for the full rationale.
        use-flakehub: false
        diagnostic-endpoint: ""

    # The pinned revision, the arm64 delay-import patch, and the cross
    # build recipe itself all live solely in flake.nix's `tcc` derivation
    # now -- see that file's own comment on `tcc` for why nixpkgs' own
    # `tinycc` package is not a substitute.
    # --out-link result-tcc, not the default `./result`: jobs that need
    # both this action and setup-wine (posix-optsrun, ntlibc-suite,
    # libc-test) run both actions' `nix build` in this same checkout
    # directory. With both defaulting to `./result`, setup-wine's later
    # `nix build .#wine-fork` clobbers the symlink this step just made,
    # so the `$PWD/result/bin` entry already appended to $GITHUB_PATH
    # silently starts resolving to Wine's bin/ instead of tcc's --
    # `x86_64-win32-tcc: not found` even though this step visibly
    # succeeded earlier in the same job. A distinct link name per action
    # makes the two builds' outputs coexist instead of racing for one path.
    - name: Build tinycc
      shell: bash
      run: nix build .#tcc --out-link result-tcc

    - name: Verify and expose the cross compilers
      shell: bash
      run: |
        test -x "result-tcc/bin/i386-win32-tcc"
        test -x "result-tcc/bin/x86_64-win32-tcc"
        test -x "result-tcc/bin/arm64-win32-tcc"
        echo "$PWD/result-tcc/bin" >> "$GITHUB_PATH"
