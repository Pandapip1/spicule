# The single implementation of "this job runs PE files", shared by every
# Wine-executing job in ci.yml.  It was three identical copies of the same
# five lines; a copy is not just duplication here, it is a place for the
# legs to silently disagree about which Wine ran the suite.
#
# This installs OUR PATCHED Wine fork (Pandapip1/wine), not the stock apt
# package.  Stock Wine has no RtlCloneUserProcess and cannot fork(), which
# made every fork-dependent expectation (sigaction/17-*, the fork clauses,
# ...) unfalsifiable in CI: a row could be right on a developer's patched
# build and wrong here for no reason but which binary ran it.  The patched
# build is what actually implements the syscalls ntlibc's tests exercise.

name: Set up Wine
description: Build ntlibc's patched Wine fork via flake.nix's `wine-fork` package, restoring it from cache on a hit

runs:
  using: composite
  steps:
    # cachix/install-nix-action, not DeterminateSystems/nix-installer-action
    # -- see .github/workflows/ci.yml's `linux-builds` job for the full
    # rationale (no FlakeHub registration here, so the Determinate
    # installer's default FlakeHub login always fails).
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ github.token }}
    - name: Set up Magic Nix Cache
      uses: DeterminateSystems/magic-nix-cache-action@v14
      with:
        # use-flakehub: false / diagnostic-endpoint: "" -- see ci.yml's
        # `linux-builds` job for the full rationale.
        use-flakehub: false
        diagnostic-endpoint: ""

    # The pinned fork commit and the from-source build recipe itself
    # (nixpkgs' wineWow64Packages.minimal, overridden for our fork's
    # source/rev) both live solely in flake.nix's `wineFork` derivation
    # now -- see that file's own comment on it for why the arch list is
    # forced to match this action's own downstream needs.
    - name: Build patched Wine
      shell: bash
      run: nix build .#wine-fork

    - name: Verify and expose the patched Wine build
      shell: bash
      run: |
        test -x "result/bin/wine"
        test -x "result/bin/wineserver"
        echo "$PWD/result/bin" >> "$GITHUB_PATH"

    - name: Report Wine version
      shell: bash
      run: |
        wine --version
        wineserver --version
