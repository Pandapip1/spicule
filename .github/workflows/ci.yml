name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Do not cancel superseded runs: each commit on main remains useful bisect
# evidence, and the real-Windows jobs are the only oracle for native NT.
jobs:
  reuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Submodules are separate projects with their own licensing metadata.
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v5

  # The minimum supported Windows version, checked against the import list
  # that decides it (tools/lint-minver.sh). Its own job, and the cheapest
  # one here: it reads README.md and tools/ntdll.def out of the checkout,
  # builds nothing, and needs neither the cross toolchain nor Wine.
  #
  # It is in CI, and not only in tools/gate.sh, because it guards the one
  # claim no other job in this file can test. `ntlibc-suite` runs under
  # Wine, whose ntdll has no version gates at all and resolves every
  # import regardless of vintage; `windows-test` runs on Server 2025,
  # which is many releases past the floor. Both are green on an image
  # that older Windows would refuse to load outright -- which is exactly
  # how the Windows 7 floor went unrecorded for as long as it did.
  minver:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # No `submodules:` -- this reads two files from this repository and
      # nothing else.
      - uses: actions/checkout@v7
      - name: Minimum supported Windows version
        run: ./tools/lint-minver.sh

  # Build the win32-cross tinycc toolchain once and cache it via Magic Nix
  # Cache, so a normal CI run restores a prebuilt toolchain instead of
  # rebuilding a whole cross-compiler from scratch every time.
  build-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # id-token: write is what DeterminateSystems/magic-nix-cache-action's
    # own README example asks every job using it to set -- see the same
    # comment on the `linux-builds` job below.
    permissions:
      id-token: "write"
      contents: "read"
    steps:
      - uses: actions/checkout@v7
      - name: Restore or build tinycc
        uses: ./.github/actions/setup-tinycc

  # Build our patched Wine fork once and cache it via Magic Nix Cache,
  # exactly like build-toolchain does for tinycc. A Wine build takes tens
  # of minutes; every job that needs Wine below restores this cache
  # instead of rebuilding it.
  build-wine:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # id-token: write is what DeterminateSystems/magic-nix-cache-action's
    # own README example asks every job using it to set -- see the same
    # comment on the `linux-builds` job below.
    permissions:
      id-token: "write"
      contents: "read"
    steps:
      - uses: actions/checkout@v7
      - name: Restore or build patched Wine
        uses: ./.github/actions/setup-wine

  # Linux is complete on aarch64; x86_64 and i386 currently have curated
  # CRT build/run coverage, plus the ELF-loader subset on x86_64.  Keep each
  # architecture visible as its own matrix leg even though the x86 legs run
  # under qemu on the arm64 host.
  #
  # All three legs move to flake.nix's devShell, not just aarch64: the
  # aarch64 leg is a real native build+run on this job's own runner arch,
  # and the x86_64/i386 legs were ALREADY cross-compiled (clang --target=
  # ...-linux-gnu -fuse-ld=lld, -nostdlib -nostdinc, no host sysroot
  # touched at all -- see tools/linux-build-crt-cross.sh's own banner) and
  # run under qemu-user, not natively -- exactly the same runner/emulation
  # split this job had under apt, so there is no arch this conversion asks
  # Nix to do that apt was not already doing. That also means there is no
  # 32-bit multilib gap to worry about for i386: nixpkgs' clang, like
  # apt's, never resolves a host libc/sysroot for these builds at all.
  # pkgs.clang/pkgs.lld/pkgs.qemu-user are already in flake.nix's devShell
  # for exactly this job (see that file's own comment on those packages).
  # Verified locally on this project's own aarch64 dev host -- the same
  # runner arch `ubuntu-24.04-arm` gives CI -- via `nix develop --command
  # ...` for each of this job's real steps: the aarch64-native
  # `make` build plus every tools/linux-build*.sh suite (dirent, dlfcn,
  # fs, malloc, misc, open, process, pthread-mutex, rename, socket*,
  # statfam, thread, time, unistd2) all report PASS/ALL CHECKS PASSED; the
  # x86_64 and i386 cross builds under qemu-x86_64/qemu-i386 (tools/linux-
  # build-crt-cross.sh) both report PASS; and the x86_64 ELF-loader
  # dlopen()/dlsym() suite (tools/linux-build-dlfcn-cross.sh) reports ALL
  # DLOPEN TESTS PASS -- all identical to today's clean CI result on every
  # arch this job covers.
  linux-builds:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    # id-token: write is what DeterminateSystems/magic-nix-cache-action's
    # own README example asks every job using it to set -- see the same
    # comment on the `lint` job below.
    permissions:
      id-token: "write"
      contents: "read"
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64, i386]
    name: Linux build (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        # cachix/install-nix-action, not DeterminateSystems/nix-installer-
        # action: this repo has no FlakeHub registration, and the
        # Determinate installer's default `determinate: true` installs
        # Determinate Nix and then attempts a FlakeHub login that always
        # fails here (logged misleadingly as "Logged in to FlakeHub" right
        # before magic-nix-cache-action's own FlakeHub call 401s). Rather
        # than tune that action's login away, install plain upstream Nix
        # instead -- flakes and nix-command are on by default here too:
        # this action's own install-nix.sh unconditionally appends
        # `experimental-features = nix-command flakes` unless
        # `extra_nix_config` already sets `experimental-features` (see
        # https://github.com/cachix/install-nix-action, "Differences from
        # the default Nix installer"), so every `nix develop` call below
        # is unaffected. `github_access_token` follows that same
        # README's own "Usage with Flakes" example, to keep this flake's
        # GitHub-hosted inputs (nixpkgs, flake-parts, ...; see
        # flake.lock) off the unauthenticated GitHub API rate limit
        # across this many concurrent legs -- no new secret, just the
        # ambient job token.
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          # use-flakehub: false -- this repo has no FlakeHub registration,
          # so the default ("no-preference", i.e. turn on FlakeHub Cache
          # opportunistically) makes this action probe FlakeHub Cache and
          # get a real 401 back; disabling it explicitly is a real,
          # documented input for exactly this
          # (github.com/DeterminateSystems/magic-nix-cache-action, `use-
          # flakehub` in action.yml/README). GitHub Actions cache (use-
          # gha-cache, left at its default) is unaffected.
          # diagnostic-endpoint: "" -- also documented in that same
          # action.yml ("to disable set this to an empty string"); no
          # reason to phone home from every one of this many concurrent
          # legs.
          use-flakehub: false
          diagnostic-endpoint: ""
      - name: Configure
        if: matrix.arch == 'aarch64'
        run: >-
          nix develop --command ./configure --platform=linux CC=clang
          CFLAGS="-fno-stack-protector -mno-outline-atomics"
      - name: Build library and CRT
        if: matrix.arch == 'aarch64'
        run: nix develop --command make -j"$(nproc)"
      - name: Run native Linux build suites
        if: matrix.arch == 'aarch64'
        env:
          NTLIBC_ARCH: aarch64
        # $(nproc)/$script expand in this step's own (non-Nix) shell, same
        # as every other run: block here -- only the built binary each
        # invocation execs (the script named by $script) runs inside
        # nix develop, so there is nothing here for a nested single-quoted
        # shell -c string to swallow the way the `lint` job's stage
        # invocations don't need one either.
        run: |
          for script in tools/linux-build*.sh; do
            case "$script" in
              *-cross.sh) continue ;;
            esac
            nix develop --command "$script"
          done
      - name: Build and run cross-architecture CRT
        if: matrix.arch != 'aarch64'
        run: nix develop --command tools/linux-build-crt-cross.sh ${{ matrix.arch }}
      - name: Build and run x86_64 ELF loader
        if: matrix.arch == 'x86_64'
        run: nix develop --command tools/linux-build-dlfcn-cross.sh x86_64

  # Every row produces the exact PE files consumed by its matching native
  # Windows runner below, including arm64 rather than treating that row as a
  # compile-only archive check.
  build-test-exes:
    needs: build-toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # id-token: write is what DeterminateSystems/magic-nix-cache-action's
    # own README example asks every job using it to set -- see the same
    # comment on the `linux-builds` job above.
    permissions:
      id-token: "write"
      contents: "read"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: i386-win32, cc: i386-win32-tcc, kernel32: disable, name: i386, target: test-exes, upload: true }
          - { host: x86_64-win32, cc: x86_64-win32-tcc, kernel32: disable, name: x86_64, target: test-exes, upload: true }
          - { host: x86_64-win32, cc: x86_64-win32-tcc, kernel32: enable, name: x86_64-kernel32, target: test-exes, upload: true }
          - { host: arm64-win32, cc: arm64-win32-tcc, kernel32: disable, name: arm64, target: test-exes, upload: true }
    name: Windows build (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7
      - name: Set up tinycc
        uses: ./.github/actions/setup-tinycc
      - name: Configure
        run: ./configure --host=${{ matrix.host }} CC=${{ matrix.cc }} --${{ matrix.kernel32 }}-kernel32
      - name: Build ${{ matrix.name }} artifacts
        run: make -j"$(nproc)" ${{ matrix.target }}
      - name: Upload test binaries
        if: matrix.upload
        uses: actions/upload-artifact@v7
        with:
          name: test-exes-${{ matrix.name }}
          # Keep obj/{test,sh}; sh-main.exe walks this layout to its fixture.
          path: |
            obj/test/*.exe
            obj/test/*.dll
            obj/sh/sh.exe
          if-no-files-found: error

  ntlibc-suite:
    needs: [build-toolchain, build-wine]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # id-token: write is what DeterminateSystems/magic-nix-cache-action's
    # own README example asks every job using it to set -- see the same
    # comment on the `linux-builds` job above.
    permissions:
      id-token: "write"
      contents: "read"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: i386-win32, cc: i386-win32-tcc, kernel32: disable, name: i386 }
          - { host: x86_64-win32, cc: x86_64-win32-tcc, kernel32: disable, name: x86_64 }
          - { host: x86_64-win32, cc: x86_64-win32-tcc, kernel32: enable, name: x86_64-kernel32 }
    steps:
      - uses: actions/checkout@v7
      - name: Set up tinycc
        uses: ./.github/actions/setup-tinycc
      - name: Set up Wine
        uses: ./.github/actions/setup-wine
      - name: Configure
        run: ./configure --host=${{ matrix.host }} CC=${{ matrix.cc }} --${{ matrix.kernel32 }}-kernel32
      - name: Build and check
        run: >-
          make -j"$(nproc)" ${{ matrix.name == 'x86_64' && 'check-pedantic' || 'check' }}
          TEST_PROFILE="capability.symlink=no capability.console=no"
      - name: Check generated files
        if: matrix.name == 'x86_64'
        run: |
          make generated
          git diff --exit-code -- 'arch/*/bits/*.h.gen' 'include/*.h.gen'
          git diff --exit-code -- boot/kaem/

  libc-test:
    needs: [build-toolchain, build-wine]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # id-token: write is what DeterminateSystems/magic-nix-cache-action's
    # own README example asks every job using it to set -- see the same
    # comment on the `linux-builds` job above.
    permissions:
      id-token: "write"
      contents: "read"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up tinycc
        uses: ./.github/actions/setup-tinycc
      - name: Set up Wine
        uses: ./.github/actions/setup-wine
      - name: Configure and build
        run: |
          ./configure --host=x86_64-win32 CC=x86_64-win32-tcc --disable-kernel32
          make -j"$(nproc)"
      - name: Run libc-test corpus
        run: make libc-test-pedantic

  posix-optsrun:
    needs: [build-toolchain, build-wine]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # id-token: write is what DeterminateSystems/magic-nix-cache-action's
    # own README example asks every job using it to set -- see the same
    # comment on the `linux-builds` job above.
    permissions:
      id-token: "write"
      contents: "read"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      - name: Set up tinycc
        uses: ./.github/actions/setup-tinycc
      - name: Set up Wine
        uses: ./.github/actions/setup-wine
      - name: Configure and build
        run: |
          ./configure --host=x86_64-win32 CC=x86_64-win32-tcc --disable-kernel32
          make -j"$(nproc)"
      - name: Check runner invariants
        run: ./tools/posix-opts.py selftest
      - name: Run buildable Open POSIX Test Suite cases
        run: make posix-optsrun-pedantic

  windows-test:
    needs: build-test-exes
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: i386, arch: i386, kernel32: no, runner: windows-latest }
          - { name: x86_64, arch: x86_64, kernel32: no, runner: windows-latest }
          - { name: x86_64-kernel32, arch: x86_64, kernel32: yes, runner: windows-latest }
          - { name: arm64, arch: aarch64, kernel32: no, runner: windows-11-arm }
    steps:
      - uses: actions/checkout@v7
      - name: Download test binaries
        uses: actions/download-artifact@v8
        with:
          name: test-exes-${{ matrix.name }}
          path: test-exes
      - name: Report Windows version
        shell: pwsh
        run: |
          $cv = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion"
          Write-Host "harness: leg=${{ matrix.name }} build=$($cv.CurrentBuild) UBR=$($cv.UBR) display=$($cv.DisplayVersion)"
      - name: Run test binaries on real Windows
        shell: pwsh
        run: >-
          python tools/run-tests.py --artifact-root test-exes
          --profile runtime=windows --profile target_arch=${{ matrix.arch }}
          --profile kernel32=${{ matrix.kernel32 }}

  # linkcheck and hygiene were local-gate-only for their whole life, so a
  # push could go red on `tools/gate.sh` and green here.  Both need the
  # real $(CC) rather than a host compiler -- linkcheck's whole point is a
  # genuine per-arch PE link, which is how `#define alloca __builtin_alloca`
  # once shipped past every host-toolchain lint -- so they need the pinned
  # tinycc, but neither needs Wine: nothing is executed.
  #
  # tinycc itself now comes from flake.nix's own `tcc` package too (via
  # setup-tinycc, which just runs `nix build .#tcc`), same as the
  # declaration-scanner toolchain below: tools/clang/DeclScanner.cpp is the
  # exact same clang plugin the `lint` job's `undefined`/`unreferenced`
  # stages already build and run via flake.nix's devShell (see the `lint`
  # job matrix further down), so this is the already-proven via: nix path,
  # not a new one. Verified locally for both arches: with the pinned
  # tinycc on PATH, `nix develop --command make -j"$(nproc)" linkcheck`
  # after each arch's own `./configure` reproduces today's clean result
  # exactly -- "no findings" for both i386 (1080 checked, 0 unlinkable) and
  # x86_64.
  linkcheck:
    needs: build-toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # id-token: write is what DeterminateSystems/magic-nix-cache-action's
    # own README example asks every job using it to set -- see the same
    # comment on the `lint` job below.
    permissions:
      id-token: "write"
      contents: "read"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: i386-win32, cc: i386-win32-tcc }
          - { host: x86_64-win32, cc: x86_64-win32-tcc }
    name: linkcheck (${{ matrix.host }})
    steps:
      - uses: actions/checkout@v7
      - name: Set up tinycc
        # Also installs Nix and Magic Nix Cache as part of building
        # flake.nix's `tcc` package -- nothing further to set up before
        # the `nix develop` call below.
        uses: ./.github/actions/setup-tinycc
      - name: Configure
        run: ./configure --host=${{ matrix.host }} CC=${{ matrix.cc }} --disable-kernel32
      # The declared-symbol scanner (tools/clang/DeclScanner.cpp) is a
      # real clang AST walk, built as a clang plugin the same way
      # flake.nix's devShell already builds it for the `lint` job's
      # `undefined`/`unreferenced` stages -- resolving Nix's clang-18/
      # llvm-18 instead of an apt-installed one changes nothing about
      # what this step actually runs, and tcc (the real per-arch linker
      # under test) still comes from the pinned setup-tinycc action
      # above either way.
      - name: Link every declared symbol
        run: nix develop --command make -j"$(nproc)" linkcheck

  # hdr-hygiene.sh sweeps both arches itself; the $(GENH) prerequisite just
  # needs *a* configured arch to exist.
  hygiene:
    needs: build-toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # id-token: write is what DeterminateSystems/magic-nix-cache-action's
    # own README example asks every job using it to set -- see the same
    # comment on the `linux-builds` job above.
    permissions:
      id-token: "write"
      contents: "read"
    steps:
      - uses: actions/checkout@v7
      - name: Set up tinycc
        uses: ./.github/actions/setup-tinycc
      - name: Configure
        run: ./configure --host=x86_64-win32 CC=x86_64-win32-tcc --disable-kernel32
      - name: Compile every public header in isolation
        run: make hygiene

  lint:
    runs-on: ubuntu-24.04
    # ownership is Z3-bottlenecked path-sensitive analysis over every source
    # file, three checker passes each: real runs on this runner class took
    # ~23-25 real minutes even with the upstream-Z3 swap this job used to
    # carry (see git history), so it alone gets a wider ceiling. That
    # swap is gone now -- this stage uses flake.nix's own (newer) Z3 like
    # every other via: nix leg below -- but real CI timing on that
    # simplified config doesn't exist yet, so the wider ceiling stays as a
    # safety margin until it does. Every other leg has run in single-digit
    # minutes since this file's own history, so leaving their budget at 25
    # keeps a stage that genuinely hangs failing fast instead of masking it
    # here.
    timeout-minutes: ${{ matrix.stage == 'ownership' && 45 || 25 }}
    # id-token: write is what DeterminateSystems/magic-nix-cache-action's own
    # README example asks every job using it to set (see
    # https://github.com/DeterminateSystems/magic-nix-cache-action#usage);
    # harmless on the `via: apt` rows below, which never touch Nix at all.
    permissions:
      id-token: "write"
      contents: "read"
    strategy:
      fail-fast: false
      matrix:
        include:
          # via: nix moves a stage's tool install off apt-get and onto
          # flake.nix's own devShell -- the same toolchain contributors
          # already use locally -- so CI can never resolve a different
          # clang-18/llvm-18/z3/etc. version than local dev does. This is
          # the fix for the exact class of bug that made the `ownership`
          # row below time out: ubuntu-24.04's apt libz3-dev had drifted
          # years behind Z3 upstream, undetected until a real workload hit
          # the gap. `ownership` was first fixed with a pinned upstream-Z3
          # download layered on top of `via: apt` (see git history), then
          # moved onto flake.nix's own (newer still) Z3 like every other
          # row here, dropping that download entirely -- nix already
          # resolves the right Z3 for whatever runner arch it's on, with
          # no separate pin to maintain. via: apt is left alone (see its
          # own per-row reasoning further down) wherever nixpkgs does not
          # carry a drop-in equivalent, or carries a *different* one whose
          # findings provably disagree with what CI runs today.
          - { stage: warn, via: apt, packages: "clang gcc-aarch64-linux-gnu gcc-mingw-w64-i686 gcc-mingw-w64-x86-64" }
          - { stage: analyze, via: nix, packages: "" }
          # cppcheck was kept on apt during the rest of this migration:
          # nixpkgs' cppcheck (2.21.1) reported a real uninitvar finding at
          # src/util/man_gz.c:400 that ubuntu-24.04's apt cppcheck (2.13.0)
          # cannot see. Fixed there (an explicit zero-init of `lengths`,
          # same reasoning as clen_lengths just above it in that function --
          # see that fix's own commit), and confirmed via nixpkgs' cppcheck
          # under `nix develop`: 0 findings across i386/x86_64/aarch64,
          # matching apt's cppcheck's own "0 findings" baseline today.
          - { stage: cppcheck, via: nix, packages: "" }
          - { stage: shell, via: apt, packages: shellcheck }
          - { stage: fallible, via: nix, packages: "" }
          - { stage: locks, via: nix, packages: "" }
          - { stage: lockset, via: nix, packages: "" }
          - { stage: reentrancy, via: nix, packages: "" }
          - { stage: variadic, via: nix, packages: "" }
          - { stage: signals, via: nix, packages: "" }
          - { stage: abizeroinit, via: nix, packages: "" }
          - { stage: initproof, via: nix, packages: "" }
          - { stage: errno, via: nix, packages: "" }
          - { stage: purity, via: nix, packages: "" }
          - { stage: ownership, via: nix, packages: "" }
          - { stage: undefined, via: nix, packages: "" }
          - { stage: unreferenced, via: nix, packages: "" }
          - { stage: widthmod, via: apt, packages: "" }
    name: lint (${{ matrix.stage }})
    steps:
      - uses: actions/checkout@v7
      # via: nix rows get the same toolchain contributors already use
      # locally (flake.nix's devShell), instead of apt resolving whatever
      # ubuntu-24.04's own package snapshot happens to carry that day.
      - name: Install Nix
        if: matrix.via == 'nix'
        # cachix/install-nix-action -- see the `linux-builds` job's copy
        # of this comment for the full rationale and sources.
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Magic Nix Cache
        if: matrix.via == 'nix'
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          # use-flakehub: false / diagnostic-endpoint: "" -- see the
          # `linux-builds` job's copy of this comment.
          use-flakehub: false
          diagnostic-endpoint: ""
      - name: Install stage tools
        if: matrix.via == 'apt' && matrix.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
      - name: Run lint stage
        if: matrix.via == 'apt'
        env:
          CLANG_TIDY: clang-tidy-18
          LINT_TIDY_EXACT: "1"
        run: tools/lint.sh ${{ matrix.stage }}
      # Same invocation apt rows use above, just inside the devShell so
      # tools/lint.sh's `require_tool clang-18` (etc.) resolves flake.nix's
      # versionedLlvm18 names instead of a bare PATH lookup.
      - name: Run lint stage (Nix devShell)
        if: matrix.via == 'nix'
        env:
          CLANG_TIDY: clang-tidy-18
          LINT_TIDY_EXACT: "1"
        run: nix develop --command bash -c 'tools/lint.sh ${{ matrix.stage }}'
      - name: Upload lint logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-logs-${{ matrix.stage }}
          path: obj/lint/
          if-no-files-found: warn

  # Was deliberately left on `via: apt` after this project's apt->Nix
  # migration flagged one real, concrete blocker here: nixpkgs' clang
  # cc-wrapper injects `-fwrapv` by default (its standard `strictoverflow`
  # hardening flag, part of $NIX_HARDENING_ENABLE), which makes signed
  # integer overflow well-defined and silently compiles UBSan's
  # signed-integer-overflow check -- part of the `-fsanitize=undefined`
  # group tools/asan-build.sh relies on -- to nothing, with no red build to
  # reveal it. Measured at the time: `return INT_MAX + 1;` built under `nix
  # develop`'s clang with this job's exact SAN flags ran clean (no
  # diagnostic), while the identical build with `-fno-wrapv` appended
  # correctly reported the overflow. Everything else about the Nix
  # toolchain checked out -- runtime resolution/linking for both
  # -fsanitize=address and -fsanitize=undefined,-shared-libsan builds
  # matches apt's clang exactly.
  #
  # The fix is now in tools/asan-build.sh itself: it appends `-fno-wrapv`
  # to every sanitizer build unconditionally, reasserting the script's own
  # precondition ("signed overflow is UB, that's what the sanitizer is
  # for") rather than depending on the ambient absence of a hardening flag
  # a particular clang wrapper happens not to inject. That closes the gap
  # at the source, so this job's own behaviour no longer depends on which
  # clang is on PATH, and it can move to the same `via: nix` pattern as
  # every other Linux-hosted job.
  asan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # id-token: write is what DeterminateSystems/magic-nix-cache-action's
    # own README example asks every job using it to set -- see the same
    # comment on the `linux-builds` job.
    permissions:
      id-token: "write"
      contents: "read"
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        # cachix/install-nix-action -- see the `linux-builds` job's copy
        # of this comment for the full rationale and sources.
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          # use-flakehub: false / diagnostic-endpoint: "" -- see the
          # `linux-builds` job's copy of this comment.
          use-flakehub: false
          diagnostic-endpoint: ""
      - name: Run AddressSanitizer and UBSan suite
        # capability.overcommit=yes, explicitly.  The Makefile's
        # TEST_PROFILE default declares `no`, because the machine this
        # project is developed on has vm.overcommit_memory=2 and no
        # ASan-linked binary can start there (tools/asan-available.sh).
        # These runners have the default overcommit setting, so ASan runs
        # for real here -- and THIS JOB IS THE ONLY PLACE IT DOES, which
        # makes it the sole authority for heap-overflow, use-after-free,
        # double-free and leak findings.  Saying it here rather than
        # relying on asan-available.sh's stale-declaration veto is the
        # difference between a stated intent and a lucky one.
        env:
          TEST_PROFILE: capability.overcommit=yes
        run: nix develop --command make ARCH=x86_64 asan
      - name: Upload failing test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: asan-output
          # obj/asan/test/*.out alone used to be the whole list, which
          # only ever carries RUNTIME output -- nothing for a link-time
          # failure. tools/asan-build.sh's own log now prints
          # unlinkable.txt's contents directly (see that script's own
          # comment on the FAILED branch), but the workspace does not
          # survive the job either way, so also carry the raw materials
          # here: unlinkable.txt/skipped.txt for the summary counts this
          # job's log already quotes, and *.link.err for the full,
          # unfiltered linker output behind whichever line of
          # unlinkable.txt matters.
          path: |
            obj/asan/test/*.out
            obj/asan/test/*.link.err
            obj/asan/unlinkable.txt
            obj/asan/skipped.txt
          if-no-files-found: warn
